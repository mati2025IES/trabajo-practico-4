<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrito - CapaCapa</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="navbar"></div>

  <main class="productos">
    <h2>Tu Carrito</h2>
    <div id="carrito-container"></div>
    <div id="carrito-total" class="carrito-total"></div>
    <div id="carrito-acciones" class="carrito-acciones"></div>

    <!-- Formulario de checkout (oculto hasta confirmar compra) -->
    <div id="checkout-form" class="checkout-form" style="display:none;">
      <h3>Datos de envío</h3>
      <form id="form-envio">
        <label for="direccion">Dirección de envío</label>
        <input type="text" id="direccion" placeholder="Ej: Av. Corrientes 1234, CABA" required>

        <label class="checkbox-label">
          <input type="checkbox" id="envio-express">
          Envío express (+24hs)
        </label>

        <div class="checkout-botones">
          <button type="button" class="btn btn-cancelar" onclick="cancelarCheckout()">Cancelar</button>
          <button type="submit" class="btn btn-comprar">Confirmar compra</button>
        </div>
      </form>
    </div>
  </main>

  <footer>
    <p>&copy; 2025 CapaCapa - Todos los derechos reservados.</p>
  </footer>

  <script src="/js/navbar.js"></script>
  <script src="/js/carrito.js"></script>
</body>
</html>
